name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The release toolchain (MSVC) on every push and pull request, so anyone can download a freshly built cdmodkit.asi from
# the Actions tab (artifact cdmodkit-msvc) without a local toolchain, and a pull request that does not compile is caught.
jobs:
  msvc:
    name: MSVC (Visual Studio)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lz4
      - name: Dependencies (MinHook, Dear ImGui)
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.3 https://github.com/TsudaKageyu/minhook tools/minhook
          git clone --depth 1 --branch v1.91.5 https://github.com/ocornut/imgui tools/imgui
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: cmd
        run: asi\cdmodkit\build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: cdmodkit-msvc
          path: |
            asi/cdmodkit/build/cdmodkit.asi
            asi/cdmodkit/data/prefabs.tsv
            asi/cdmodkit/data/settings.txt
            asi/cdmodkit/data/errnames.txt
            asi/cdmodkit/data/locales.tsv

